<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, sans-serif">
<!-- DO NOT regenerate from .mmd — this SVG is hand-styled. Edit the .mmd for structure, then update this SVG manually. -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#facc15"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">Shipyard — Eval Loop</text>
  <text x="600" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">every AI output is judged before it ships — benchmarks against stored baselines catch quality regressions</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 1: AI OUTPUT -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="30" y="85" width="1140" height="78" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <text x="50" y="105" fill="#a5b4fc" font-size="11" font-weight="bold" letter-spacing="2">1 — AI OUTPUT PRODUCED</text>

  <rect x="170" y="115" width="240" height="38" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="290" y="130" text-anchor="middle" fill="#e0e7ff" font-size="11" font-weight="bold">PRD</text>
  <text x="290" y="145" text-anchor="middle" fill="#a5b4fc" font-size="9">github_issue_prd_flow</text>

  <rect x="470" y="115" width="240" height="38" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="590" y="130" text-anchor="middle" fill="#e0e7ff" font-size="11" font-weight="bold">PR description</text>
  <text x="590" y="145" text-anchor="middle" fill="#a5b4fc" font-size="9">SpaceBot implementation worker</text>

  <rect x="770" y="115" width="240" height="38" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="890" y="130" text-anchor="middle" fill="#e0e7ff" font-size="11" font-weight="bold">Issue comment</text>
  <text x="890" y="145" text-anchor="middle" fill="#a5b4fc" font-size="9">answers · analyses · bot replies</text>

  <!-- L1 → L2 -->
  <line x1="590" y1="153" x2="590" y2="195" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="180" text-anchor="middle" fill="#94a3b8" font-size="9">eval_regression_gate · run_gate(output, output_type, context)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 2: JUDGE + GATE -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="30" y="195" width="1140" height="165" rx="8" fill="#431407" stroke="#fb923c" stroke-width="1.5" opacity="0.9"/>
  <text x="50" y="215" fill="#fdba74" font-size="11" font-weight="bold" letter-spacing="2">2 — LLM-AS-JUDGE · PRE-SHIP GATE</text>

  <rect x="60" y="230" width="380" height="56" rx="6" fill="#7c2d12" stroke="#fdba74" stroke-width="1.5" filter="url(#glow)"/>
  <text x="250" y="248" text-anchor="middle" fill="#ffedd5" font-size="11" font-weight="bold">Judge — rubric scoring</text>
  <text x="250" y="262" text-anchor="middle" fill="#fdba74" font-size="9">rubrics: content · code · structured_data (YAML, hot-editable)</text>
  <text x="250" y="275" text-anchor="middle" fill="#fdba74" font-size="9">per-criterion breakdown → weighted score 0–1</text>

  <line x1="440" y1="258" x2="490" y2="258" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="465" y="251" text-anchor="middle" fill="#fdba74" font-size="9">score</text>

  <rect x="490" y="230" width="200" height="56" rx="6" fill="#7c2d12" stroke="#fb923c" stroke-width="1"/>
  <text x="590" y="251" text-anchor="middle" fill="#ffedd5" font-size="11" font-weight="bold">Threshold check</text>
  <text x="590" y="266" text-anchor="middle" fill="#fdba74" font-size="9">default 0.7 · per-call override</text>
  <text x="590" y="279" text-anchor="middle" fill="#fdba74" font-size="9">decision logged → gate_log/ (trending)</text>

  <!-- pass -->
  <line x1="690" y1="244" x2="780" y2="244" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="735" y="237" text-anchor="middle" fill="#86efac" font-size="9">≥ threshold: PASS</text>

  <!-- retry loop -->
  <path d="M 540 286 C 480 330, 330 330, 268 290" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="404" y="332" text-anchor="middle" fill="#fca5a5" font-size="9">below threshold → regenerate with judge feedback (max 2 retries)</text>

  <!-- escalation -->
  <rect x="780" y="226" width="370" height="38" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="965" y="241" text-anchor="middle" fill="#dcfce7" font-size="11" font-weight="bold">Ships</text>
  <text x="965" y="256" text-anchor="middle" fill="#86efac" font-size="9">comment posted · PR created · PRD published</text>

  <rect x="780" y="278" width="370" height="50" rx="6" fill="#713f12" stroke="#facc15" stroke-width="1.5" filter="url(#glow)"/>
  <text x="965" y="296" text-anchor="middle" fill="#fef9c3" font-size="11" font-weight="bold">HUMAN REVIEW — retries exhausted</text>
  <text x="965" y="310" text-anchor="middle" fill="#fde68a" font-size="9">Telegram notification with score + judge feedback —</text>
  <text x="965" y="322" text-anchor="middle" fill="#fde68a" font-size="9">nothing low-quality ships silently</text>

  <line x1="690" y1="276" x2="775" y2="295" stroke="#facc15" stroke-width="1.5" marker-end="url(#arrowGold)"/>
  <text x="722" y="297" text-anchor="middle" fill="#fde68a" font-size="9">still failing</text>

  <!-- L2 → L3 -->
  <line x1="250" y1="286" x2="250" y2="395" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowTeal)"/>
  <text x="135" y="375" text-anchor="middle" fill="#5eead4" font-size="9">same judge, offline</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYER 3: BENCHMARKS -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="30" y="395" width="1140" height="120" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5" opacity="0.9"/>
  <text x="50" y="415" fill="#5eead4" font-size="11" font-weight="bold" letter-spacing="2">3 — BENCHMARKS &amp; BASELINES · REGRESSION DETECTION</text>

  <rect x="60" y="430" width="330" height="56" rx="6" fill="#115e59" stroke="#2dd4bf" stroke-width="1"/>
  <text x="225" y="448" text-anchor="middle" fill="#ccfbf1" font-size="11" font-weight="bold">Benchmark suites (YAML test cases)</text>
  <text x="225" y="462" text-anchor="middle" fill="#5eead4" font-size="9">prd_generation · pr_descriptions · issue_comments</text>
  <text x="225" y="475" text-anchor="middle" fill="#5eead4" font-size="9">configs/eval/benchmarks/</text>

  <line x1="390" y1="458" x2="440" y2="458" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <rect x="440" y="430" width="300" height="56" rx="6" fill="#115e59" stroke="#2dd4bf" stroke-width="1"/>
  <text x="590" y="448" text-anchor="middle" fill="#ccfbf1" font-size="11" font-weight="bold">Compare vs stored baselines</text>
  <text x="590" y="462" text-anchor="middle" fill="#5eead4" font-size="9">per-suite scores vs configs/eval/baselines/</text>
  <text x="590" y="475" text-anchor="middle" fill="#5eead4" font-size="9">JSON report per run</text>

  <line x1="740" y1="458" x2="790" y2="458" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="765" y="451" text-anchor="middle" fill="#fca5a5" font-size="9">drop?</text>

  <rect x="790" y="430" width="360" height="56" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
  <text x="970" y="448" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="bold">Regression flagged</text>
  <text x="970" y="462" text-anchor="middle" fill="#fca5a5" font-size="9">prompt / rubric / model change degraded quality —</text>
  <text x="970" y="475" text-anchor="middle" fill="#fca5a5" font-size="9">fix before shipping the change</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="30" y="540" width="1140" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="50" y="563" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="2">LEGEND</text>

  <line x1="50" y1="585" x2="80" y2="585" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="90" y="589" fill="#cbd5e1" font-size="10">passes the gate</text>

  <line x1="250" y1="585" x2="280" y2="585" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="290" y="589" fill="#cbd5e1" font-size="10">retry with feedback</text>

  <line x1="470" y1="585" x2="500" y2="585" stroke="#facc15" stroke-width="1.5" marker-end="url(#arrowGold)"/>
  <text x="510" y="589" fill="#cbd5e1" font-size="10">human review escalation</text>

  <line x1="720" y1="585" x2="750" y2="585" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowTeal)"/>
  <text x="760" y="589" fill="#cbd5e1" font-size="10">offline benchmarking (same judge)</text>

  <text x="50" y="617" fill="#64748b" font-size="10">Two uses of one judge: ONLINE, the gate scores every AI output before it ships (pass / retry with feedback / escalate to you). OFFLINE, benchmark suites run the</text>
  <text x="50" y="633" fill="#64748b" font-size="10">same rubrics over fixed test cases and compare against stored baselines — so a prompt tweak, rubric edit, or model upgrade that quietly degrades output quality</text>
  <text x="50" y="649" fill="#64748b" font-size="10">is caught as a regression before it reaches production. Rubrics, benchmarks, and baselines are all YAML — reviewable and versioned like code.</text>
</svg>
